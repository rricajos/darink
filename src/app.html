<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#4aa3ff" />
		<meta name="description" content="Darink — offline-first health tracker" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Clear stale service workers and caches from pre-SvelteKit era (one-time)
			if ('serviceWorker' in navigator && !localStorage.getItem('darink-sw-v2')) {
				navigator.serviceWorker.getRegistrations().then(function(regs) {
					Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
						caches.keys().then(function(keys) {
							Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
								localStorage.setItem('darink-sw-v2', '1');
								location.reload();
							});
						});
					});
				});
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
